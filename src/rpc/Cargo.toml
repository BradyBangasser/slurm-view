[package]
name = "rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = "0.14.4"
redis = { version = "1.7.0", features = ["connection-manager", "tokio-comp"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-web = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
