ClusterName=sandbox
SlurmctldHost=localhost
SlurmUser=root
SlurmdUser=root
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd/%n
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd-%n.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd-%n.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
AccountingStorageType=accounting_storage/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SchedulerType=sched/backfill
MpiDefault=none
ReturnToService=2
# The fake nodes share one host; trust the config, not detected hardware.
SlurmdParameters=config_overrides

NodeName=c1 NodeHostname=localhost Port=17001 CPUs=4 RealMemory=4096 State=UNKNOWN
NodeName=c2 NodeHostname=localhost Port=17002 CPUs=4 RealMemory=4096 State=UNKNOWN
NodeName=c3 NodeHostname=localhost Port=17003 CPUs=8 RealMemory=8192 State=UNKNOWN
NodeName=c4 NodeHostname=localhost Port=17004 CPUs=8 RealMemory=8192 State=UNKNOWN

PartitionName=compute Nodes=c[1-3] Default=YES MaxTime=02:00:00 State=UP
PartitionName=debug   Nodes=c[3-4] MaxTime=00:30:00 State=UP
